<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gritex</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topbar">
        <div>
            <div class="logo">GRITEX</div>
            <div class="tagline">TRAIN • PLAN • IMPROVE</div>
        </div>

        <button class="round-btn" id="settingsBtn">⚙</button>
    </header>


    <main>

        <div class="hero">
            <div>
                <span class="eyebrow">DEIN PLAN</span>
                <h1>Trainingskalender</h1>
            </div>

            <div class="today-label">Heute</div>
        </div>


        <section class="calendar">

            <div class="calendar-header">
                <button class="month-btn" id="prevMonth">‹</button>

                <h2 id="monthTitle">September 2026</h2>

                <button class="month-btn" id="nextMonth">›</button>
            </div>


            <div class="weekday-row">
                <span>MO</span>
                <span>DI</span>
                <span>MI</span>
                <span>DO</span>
                <span>FR</span>
                <span>SA</span>
                <span>SO</span>
            </div>


            <div id="calendarGrid" class="calendar-grid">

                <button class="day">1</button>
                <button class="day">2</button>
                <button class="day">3</button>
                <button class="day">4</button>
                <button class="day">5</button>
                <button class="day">6</button>
                <button class="day">7</button>

                <button class="day">8</button>
                <button class="day">9</button>
                <button class="day">10</button>
                <button class="day">11</button>
                <button class="day">12</button>
                <button class="day">13</button>
                <button class="day">14</button>

                <button class="day">15</button>
                <button class="day">16</button>
                <button class="day">17</button>
                <button class="day">18</button>
                <button class="day">19</button>
                <button class="day">20</button>
                <button class="day">21</button>

                <button class="day today">22</button>
                <button class="day">23</button>
                <button class="day">24</button>
                <button class="day">25</button>
                <button class="day">26</button>
                <button class="day">27</button>
                <button class="day">28</button>

                <button class="day">29</button>
                <button class="day">30</button>

            </div>

        </section>


        <section class="selected-day">

            <span class="eyebrow">HEUTE</span>

            <h2>Montag, 22. September</h2>

            <div class="training-preview">

                <div class="training-icon">🏃</div>

                <div>
                    <h3>Lockerer Lauf</h3>
                    <p>30 Minuten entspannt laufen</p>
                </div>

            </div>

        </section>

    </main>


    <nav class="bottom-nav">

        <button class="nav-item active">
            <span>▦</span>
            <small>Kalender</small>
        </button>

        <button class="nav-item">
            <span>☷</span>
            <small>Wochenplan</small>
        </button>

        <button class="nav-item">
            <span>⚙</span>
            <small>Einstellungen</small>
        </button>

    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
